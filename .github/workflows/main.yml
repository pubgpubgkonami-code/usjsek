
<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OLED Black Cover</title>
<style>
  body {
    background: #222;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
  }
  label { display: block; margin-top: 18px; }
  input { width: 100%; }
  #preview {
    background: #000;
    width: 100%;
    height: 90px;
    margin-top: 20px;
    border: 1px solid #555;
  }
</style>
</head>
<body>
  <h2>پۆشەری ڕەشی OLED</h2>
  <p>قەبارە و شوێنی ناوچە ڕەشەکە ڕێکبخە.</p>

  <label>پانی: <span id="wval">100%</span></label>
  <input id="w" type="range" min="10" max="100" value="100">

  <label>بەرزی: <span id="hval">90px</span></label>
  <input id="h" type="range" min="10" max="250" value="90">

  <div id="preview"></div>

  <script>
    const w = document.getElementById('w');
    const h = document.getElementById('h');
    const preview = document.getElementById('preview');

    function update() {
      preview.style.width = w.value + '%';
      preview.style.height = h.value + 'px';
      document.getElementById('wval').textContent = w.value + '%';
      document.getElementById('hval').textContent = h.value + 'px';
    }

    w.addEventListener('input', update);
    h.addEventListener('input', update);
    update();
  </script>
</body>
</html>
